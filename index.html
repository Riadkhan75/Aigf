<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Muskan GF AI ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b10;color:#fff;height:100vh}
.app{height:100vh;display:flex;flex-direction:column;max-width:720px;margin:auto;background:#11131a}
header{height:64px;display:flex;align-items:center;padding:8px 14px;background:#171923;border-bottom:1px solid #292c38;gap:11px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff4f91,#8b5cf6);display:grid;place-items:center;font-size:22px}
.name{font-weight:700}.online{font-size:12px;color:#65e6a0;margin-top:2px}
.chat{flex:1;overflow-y:auto;padding:18px 13px 90px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:11px 14px;border-radius:18px;line-height:1.4;font-size:15px;white-space:pre-wrap}
.bot{align-self:flex-start;background:#242734;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#8b3d72;border-bottom-right-radius:5px}
.time{font-size:9px;opacity:.55;margin-top:5px;text-align:right}
.typing{display:none;align-self:flex-start;background:#242734;padding:11px 15px;border-radius:18px;color:#aaa}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);padding:10px;background:#11131a;border-top:1px solid #292c38;display:flex;gap:8px}
input{flex:1;border:0;outline:0;background:#242734;color:#fff;padding:13px 15px;border-radius:24px;font-size:15px}
button{width:48px;height:48px;border:0;border-radius:50%;background:#e44b8d;color:white;font-size:20px}
button:disabled{opacity:.5}
.empty{text-align:center;opacity:.5;margin:auto}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="avatar">❤️</div>
 <div><div class="name">Muskan</div><div class="online">● Online</div></div>
</header>
<div id="chat" class="chat">
 <div class="empty">Muskan-এর সাথে কথা বলো 🥰❤️</div>
</div>
<div id="typing" class="typing">Muskan is typing…</div>
<footer>
 <input id="input" autocomplete="off" placeholder="Message লিখো..." />
 <button id="send">➤</button>
</footer>
</div>
<script>
const API="/gf?prompt=";
const chat=document.getElementById("chat"), input=document.getElementById("input");
const send=document.getElementById("send"), typing=document.getElementById("typing");

function time(){return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}
function add(text,who){
 const empty=document.querySelector(".empty"); if(empty) empty.remove();
 const d=document.createElement("div"); d.className="msg "+who;
 d.textContent=text;
 const t=document.createElement("div"); t.className="time"; t.textContent=time();
 d.appendChild(t); chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
async function ask(){
 const text=input.value.trim(); if(!text||send.disabled)return;
 input.value=""; add(text,"user"); send.disabled=true; typing.style.display="block";
 chat.appendChild(typing); chat.scrollTop=chat.scrollHeight;
 try{
   const r=await fetch(API+encodeURIComponent(text));
   const data=await r.json();
   if(data.response) add(data.response,"bot");
   else add("Sorry baby, এখন reply দিতে পারছি না 🥺❤️","bot");
 }catch(e){
   add("Server-এর সাথে connection হচ্ছে না 🥺 একটু পরে চেষ্টা করো।","bot");
 }finally{
   typing.style.display="none"; send.disabled=false; input.focus();
 }
}
send.onclick=ask;
input.addEventListener("keydown",e=>{if(e.key==="Enter")ask();});
</script>
</body>
</html>
